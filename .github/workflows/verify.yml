name: Verify SkillBook
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: mvn --batch-mode verify
        env: {SKILLBOOK_BROWSER_TEST: '1'}
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: checks, path: "backend/target/surefire-reports/\nbackend/target/site/jacoco/"}
      - run: docker build -t skillbook-api backend
      - run: docker build -t skillbook-web frontend
